name: Build Dead Zone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename apk
        run: cp app/build/outputs/apk/debug/app-debug.apk DeadZone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeadZone
          path: DeadZone.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" DeadZone.apk \
            --title "Dead Zone build ${{ github.run_number }}" \
            --notes "Debug APK from commit ${GITHUB_SHA::7}"
